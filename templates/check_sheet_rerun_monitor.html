{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>YOLO再実行モニタ</h2>
        <a href="{{ url_for('check_sheet.import_check_sheet') }}" class="btn btn-secondary" id="backBtn"
            style="display: none;">チェックシートに戻る</a>
    </div>

    <!-- Progress Section -->
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">処理状況: <span id="statusText">待機中...</span></h5>
            <div class="progress mb-2" style="height: 25px;">
                <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" id="progressBar"
                    style="width: 0%;">0%</div>
            </div>
            <p class="mb-0 text-muted">現在の処理: <span id="currentVideo">-</span></p>
        </div>
    </div>

    <!-- Results Table -->
    <div class="card">
        <div class="card-header">
            実行結果比較
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered table-hover" id="resultTable">
                    <thead class="table-light">
                        <tr>
                            <th rowspan="2" class="align-middle">動画名</th>
                            <th rowspan="2" class="align-middle">Run ID</th>
                            <th colspan="3" class="text-center">白線距離 (Min/Max/Median) [m]</th>
                            <th colspan="3" class="text-center">Track ID数</th>
                            <th colspan="3" class="text-center">最大グループ追跡フレーム</th>
                            <th colspan="3" class="text-center">追い越し数</th>
                            <th rowspan="2" class="align-middle">状態</th>
                        </tr>
                        <tr>
                            <!-- Lane Dist -->
                            <th>Before</th>
                            <th>After</th>
                            <th>Diff</th>
                            <!-- Track Count -->
                            <th>Before</th>
                            <th>After</th>
                            <th>Diff</th>
                            <!-- Group Frame -->
                            <th>Before</th>
                            <th>After</th>
                            <th>Diff</th>
                            <!-- Overtake -->
                            <th>Before</th>
                            <th>After</th>
                            <th>Diff</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Rows will be added here dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    let processedCount = 0;
    const POLLING_INTERVAL = 1000; // 1 second

    function updateMonitor() {
        fetch("{{ url_for('check_sheet.api_rerun_progress') }}")
            .then(response => response.json())
            .then(data => {
                // Update Progress
                const total = data.total_videos || 1;
                const processed = data.processed_videos || 0;

                // Calculate total progress based on current video progress + processed videos
                // Each video is 1/total weight
                const currentPct = data.current_progress || 0;

                let totalPct = 0;
                if (data.status === 'completed') {
                    totalPct = 100;
                } else {
                    const videoWeight = 100 / total;
                    totalPct = (processed * videoWeight) + (currentPct * videoWeight / 100);
                }

                document.getElementById('progressBar').style.width = `${totalPct}%`;
                document.getElementById('progressBar').innerText = `${Math.floor(totalPct)}%`;

                document.getElementById('statusText').innerText =
                    data.status === 'completed' ? '完了' : `実行中 (${processed}/${total} 完了)`;
                document.getElementById('currentVideo').innerText = data.current_video || '-';

                // Update Table
                renderResults(data.results);

                if (data.status === 'completed') {
                    document.getElementById('progressBar').classList.remove('progress-bar-animated');
                    document.getElementById('progressBar').classList.add('bg-success');
                    document.getElementById('backBtn').style.display = 'inline-block';
                } else {
                    setTimeout(updateMonitor, POLLING_INTERVAL);
                }
            })
            .catch(err => {
                console.error("Polling error:", err);
                setTimeout(updateMonitor, POLLING_INTERVAL * 2);
            });
    }

    function renderResults(results) {
        if (!results) return;

        const tbody = document.querySelector('#resultTable tbody');

        // We only append NEW results to avoid redrawing everything? 
        // Or just clear and redraw for simplicity (unless list is huge).
        // Let's clear and redraw to handle updates cleanly.
        tbody.innerHTML = '';

        results.forEach(res => {
            const tr = document.createElement('tr');

            const before = res.before || {};
            const after = res.after || {};
            const error = res.error;

            if (error) {
                tr.innerHTML = `
                    <td>${res.video_name}</td>
                    <td>${res.run_id}</td>
                    <td colspan="12" class="text-danger">エラー: ${error}</td>
                    <td><span class="badge bg-danger">Error</span></td>
                `;
            } else {
                // Determine CSS for diffs
                const getDiffCell = (bef, aft, isFloat = false) => {
                    if (bef === null || aft === null || bef === undefined || aft === undefined) return '<td>-</td>';
                    let diff = aft - bef;
                    let cls = '';
                    let txt = '';

                    if (isFloat) {
                        txt = diff.toFixed(3);
                        if (Math.abs(diff) < 0.001) cls = 'text-muted';
                        else if (diff > 0) cls = 'text-primary fw-bold'; // Increased
                        else cls = 'text-danger fw-bold'; // Decreased
                    } else {
                        txt = diff > 0 ? `+${diff}` : `${diff}`;
                        if (diff === 0) cls = 'text-muted';
                        else if (diff > 0) cls = 'text-primary fw-bold';
                        else cls = 'text-danger fw-bold';
                    }
                    return `<td class="${cls}">${txt}</td>`;
                };

                const fmtVal = (v, isFloat = false) => {
                    if (v === null || v === undefined) return '-';
                    return isFloat ? v.toFixed(3) : v;
                };

                // Line Dist (Median)
                const b_dist = before.line_dist_median;
                const a_dist = after.line_dist_median;

                // Track Count
                const b_track = before.track_count;
                const a_track = after.track_count;

                // Group Frame
                const b_grp = before.max_group_frames;
                const a_grp = after.max_group_frames;

                // Overtake
                const b_over = before.overtake_count;
                const a_over = after.overtake_count;

                tr.innerHTML = `
                    <td>${res.video_name}</td>
                    <td>${res.run_id}</td>
                    
                    <td>${fmtVal(b_dist, true)}</td>
                    <td>${fmtVal(a_dist, true)}</td>
                    ${getDiffCell(b_dist, a_dist, true)}
                    
                    <td>${fmtVal(b_track)}</td>
                    <td>${fmtVal(a_track)}</td>
                    ${getDiffCell(b_track, a_track)}
                    
                    <td>${fmtVal(b_grp)}</td>
                    <td>${fmtVal(a_grp)}</td>
                    ${getDiffCell(b_grp, a_grp)}
                    
                    <td>${fmtVal(b_over)}</td>
                    <td>${fmtVal(a_over)}</td>
                    ${getDiffCell(b_over, a_over)}
                    
                    <td><span class="badge bg-success">Done</span></td>
                `;
            }
            tbody.appendChild(tr);
        });
    }

    // Start polling
    document.addEventListener('DOMContentLoaded', () => {
        updateMonitor();
    });
</script>
{% endblock %}
